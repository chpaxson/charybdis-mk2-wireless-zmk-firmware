CONFIG_ZMK_SPLIT_ROLE_CENTRAL=n

## Bluetooth
## NOTE: these used to live in config/charybdis/charybdis.conf, which is never
## actually applied by the build (Zephyr's shield .conf discovery only looks
## inside boards/shields/<shield>/<shield>.conf, it does not prefix-match
## config/charybdis.conf or config/charybdis_left.conf). Moved here so they
## actually take effect.
## https://zmk.dev/docs/troubleshooting/connection-issues#unreliableweak-connection
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_BLE=y
CONFIG_ZMK_BLE_EXPERIMENTAL_FEATURES=y
